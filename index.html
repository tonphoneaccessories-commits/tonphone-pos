<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TON-PHONE &amp; ACCESSORIES - POS</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 12px;
      background: #f1f5f9;
      color: #0f172a;
    }
    .box {
      max-width: 780px;
      margin: auto;
      background: #ffffff;
      padding: 14px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }
    .pill {
      background: #dbeafe;
      color: #1e3a8a;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: bold;
    }
    .nav {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 12px;
    }
    .nav button {
      padding: 11px;
      font-weight: bold;
      border-radius: 7px;
      border: 1px solid #cbd5e1;
      background: #e2e8f0;
      color: #0f172a;
      cursor: pointer;
    }
    .nav button.on {
      background: #1d4ed8;
      color: #ffffff;
      border-color: #1d4ed8;
    }
    .pane { display: none; }
    .pane.on { display: block; }
    .card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      padding: 11px;
      border-radius: 8px;
      margin-bottom: 10px;
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
    }
    .row > * {
      flex: 1 1 140px;
    }
    input, select, button {
      padding: 10px;
      font-size: 14px;
      border-radius: 7px;
      border: 1px solid #cbd5e1;
      width: 100%;
      box-sizing: border-box;
    }
    .btn-b { background: #1d4ed8; color: #fff; border: none; font-weight: bold; cursor: pointer; }
    .btn-g { background: #0f766e; color: #fff; border: none; font-weight: bold; cursor: pointer; }
    .btn-r { background: #b91c1c; color: #fff; border: none; font-weight: bold; cursor: pointer; }
    .btn-w { background: #ffffff; color: #0f172a; border: 1px solid #cbd5e1; font-weight: bold; cursor: pointer; }
    .item-row {
      border-bottom: 1px solid #e2e8f0;
      padding: 8px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    #msg {
      display: none;
      padding: 10px;
      border-radius: 7px;
      margin-bottom: 10px;
      font-size: 13px;
      word-break: break-word;
    }
    #cam {
      display: none;
      max-width: 380px;
      margin: 8px auto;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="top-bar">
      <h2 style="margin:0; font-size:19px;">TON-PHONE &amp; ACCESSORIES - POS</h2>
      <span id="sessionBadge" class="pill">Hajalogin (Password inahitajika)</span>
    </div>

    <div id="msg"></div>

    <!-- SEHEMU YA LOGIN YA WAFANYAKAZI KWA PASSWORD -->
    <div id="loginCard" class="card">
      <b>Ingia Mfanyakazi (Staff Login)</b>
      <div class="row" style="margin-top:8px;">
        <div>
          <small><b>Chagua Mfanyakazi</b></small>
          <select id="loginEmpSelect"></select>
        </div>
        <div>
          <small><b>Password</b></small>
          <input id="loginPassword" type="password" placeholder="Weka password (mf. 1234)" />
        </div>
      </div>
      <div class="row" style="margin-bottom:0;">
        <button type="button" class="btn-b" data-action="loginStaff">Ingia (Login)</button>
        <button type="button" class="btn-w" data-action="logoutStaff">Toka (Lock)</button>
      </div>
    </div>

    <div class="nav">
      <button type="button" id="tab_pos" class="on" data-tab="pos">Mauzo (POS)</button>
      <button type="button" id="tab_prod" data-tab="prod">Bidhaa (productss)</button>
      <button type="button" id="tab_staff" data-tab="staff">Maduka &amp; Wafanyakazi</button>
      <button type="button" id="tab_rep" data-tab="rep">Ripoti ya Siku</button>
    </div>

    <div id="cam"></div>
    <div id="camStopWrap" style="display:none; margin-bottom:8px;">
      <button type="button" class="btn-r" data-action="stopCam">Zima Kamera</button>
    </div>

    <!-- MAUZO -->
    <div id="pane_pos" class="pane on">
      <div class="card">
        <div class="row" style="margin-bottom:0;">
          <div>
            <small><b>Duka / Tawi (Mkoa)</b></small>
            <select id="sel_br">
              <option value="eec9702a-d5fa-4fdf-9466-7d8e0e4def0d">Duka Kuu — Moshi (Kilimanjaro)</option>
              <option value="branch-mwanga">Tawi la Mwanga (Kilimanjaro)</option>
              <option value="branch-dsm">Tawi la Dar es Salaam (Dar es Salaam)</option>
            </select>
          </div>
          <div>
            <small><b>Mfanyakazi Aliyeingia</b></small>
            <input id="activeEmpDisplay" type="text" readonly value="Hajaingia" />
          </div>
        </div>
      </div>

      <div class="row">
        <input id="in_code" type="text" placeholder="Weka au scan barcode" />
        <button type="button" class="btn-b" data-action="findPos">Tafuta</button>
        <button type="button" class="btn-g" data-action="scanPos">Scan Kamera</button>
      </div>

      <div id="pos_res" class="card">Tayari kutafuta bidhaa.</div>

      <div class="row">
        <input id="in_qty" type="number" step="any" min="0.01" value="1" />
        <select id="in_pay">
          <option value="cash">Cash</option>
          <option value="lipa_namba">Lipa Namba</option>
        </select>
      </div>

      <div id="pos_sum" style="font-weight:bold; margin-bottom:8px;">Makadirio ya Jumla: 0</div>
      <button type="button" class="btn-b" data-action="saveSale">Hifadhi Mauzo</button>
    </div>

    <!-- BIDHAA -->
    <div id="pane_prod" class="pane">
      <div class="card">
        <b>Ongeza Bidhaa Mpya</b>
        <div class="row" style="margin-top:8px;">
          <input id="p_name" type="text" placeholder="Jina la bid
