<!-- Skrini Kamili ya Historia ya Mauzo (Full Screen Overlay) -->
<div id="hqHistoriaScreen" class="hx-fullscreen-overlay" aria-hidden="true">
  <!-- Status Bar yenye Muda na Saa Hai -->
  <div class="hx-status-bar">
    <div id="hxLiveClock" class="hx-clock">11:46 AM</div>
    <div id="hxLiveDate" class="hx-date-sub">Jumanne, 24 Nov 2026</div>
  </div>

  <!-- Kichwa cha Juu na Kimshale cha Kurudi Nyuma -->
  <header class="hx-top-header">
    <button type="button" id="hxBackBtn" class="hx-back-btn" title="Rudi nyuma" aria-label="Rudi nyuma">
      &#8592;
    </button>
    <h1 class="hx-header-title">Historia ya Mauzo</h1>
  </header>

  <!-- Maudhui Makuu -->
  <main class="hx-main-content">
    <!-- Vijumba 4 Vikuu (2x2 Grid) -->
    <section class="hx-kpi-grid">
      <div class="hx-kpi-card">
        <div class="hx-kpi-label">Pesa Zilizoingia</div>
        <div id="hxKpiPaid" class="hx-kpi-value">TZS 0</div>
        <div class="hx-kpi-sub">Kwa tarehe ya malipo</div>
      </div>

      <div class="hx-kpi-card">
        <div class="hx-kpi-label">Orders</div>
        <div id="hxKpiOrders" class="hx-kpi-value">0</div>
      </div>

      <div class="hx-kpi-card">
        <div class="hx-kpi-label">Salio Linalosubiri</div>
        <div id="hxKpiPending" class="hx-kpi-value">TZS 0</div>
      </div>

      <div class="hx-kpi-card">
        <div class="hx-kpi-label">Wastani wa Thamani ya Order</div>
        <div id="hxKpiAvg" class="hx-kpi-value">TZS 0</div>
      </div>
    </section>

    <!-- Utafutaji, Vichujio na Export CSV -->
    <section class="hx-filters-section">
      <div class="hx-filter-row">
        <div class="hx-search-box">
          <span class="hx-search-icon">&#128269;</span>
          <input
            type="text"
            id="hxSearchInput"
            class="hx-search-input"
            placeholder="Tafuta risiti, mteja, bidhaa,"
          />
        </div>

        <select id="hxStatusFilter" class="hx-select-box" aria-label="Hali">
          <option value="ALL" selected>Hali Zote</option>
          <option value="PAID">Imelipwa</option>
          <option value="PENDING">Inasubiri / Mkopo</option>
          <option value="CANCELLED">Imefutwa</option>
        </select>
      </div>

      <div class="hx-filter-row">
        <select id="hxFulfillmentFilter" class="hx-select-box" aria-label="Utoaji">
          <option value="ALL" selected>Utoaji Wote</option>
          <option value="DELIVERED">Imekabidhiwa</option>
          <option value="PICKUP">Imeshukuliwa Dukani</option>
          <option value="PENDING">Bado Kutolewa</option>
        </select>

        <select id="hxPeriodFilter" class="hx-select-box" aria-label="Kipindi">
          <option value="30" selected>Siku 30...</option>
          <option value="7">Siku 7</option>
          <option value="90">Siku 90</option>
          <option value="ALL">Zote</option>
        </select>
      </div>

      <div class="hx-filter-row">
        <select id="hxSortFilter" class="hx-select-box" aria-label="Mpangilio">
          <option value="NEWEST" selected>Mpya Kwanza</option>
          <option value="OLDEST">Za Zamani Kwanza</option>
          <option value="HIGH_AMOUNT">Kiasi Kikubwa Kwanza</option>
          <option value="LOW_AMOUNT">Kiasi Kidogo Kwanza</option>
        </select>

        <button type="button" id="hxExportCsvBtn" class="hx-export-btn">
          <span>&#8681;</span>
          <span>Export CSV</span>
        </button>
      </div>
    </section>

    <!-- Sanduku la Matokeo / Orodha ya Mauzo -->
    <section class="hx-results-wrapper">
      <div id="hxEmptyBox" class="hx-empty-card">
        Hakuna mauzo yaliyopatikana kwa kipindi hiki.
      </div>
      <div id="hxSalesList" class="hx-sales-list"></div>
    </section>
  </main>

  <!-- Upau wa Urambazaji wa Chini -->
  <nav class="hx-bottom-nav" aria-label="Urambazaji">
    <button type="button" class="hx-nav-item" data-hx-nav="home">
      <span class="hx-nav-icon">&#8962;</span>
      <span>Home</span>
    </button>

    <button type="button" class="hx-nav-item" data-hx-nav="manage">
      <span class="hx-nav-icon">&#9776;</span>
      <span>Simamia</span>
    </button>

    <button type="button" id="hxQuickCartBtn" class="hx-fab-cart" title="Mauzo Mapya" aria-label="Mauzo Mapya">
      <span>&#128722;<sup>+</sup></span>
    </button>

    <button type="button" class="hx-nav-item" data-hx-nav="reports">
      <span class="hx-nav-icon">&#128202;</span>
      <span>Ripoti</span>
    </button>

    <button type="button" class="hx-nav-item" data-hx-nav="profile">
      <span class="hx-nav-icon">&#128100;</span>
      <span>Profile</span>
    </button>
  </nav>
</div>

<script>
(function () {
  const screenEl = document.getElementById("hqHistoriaScreen");
  const backBtn = document.getElementById("hxBackBtn");
  const clockEl = document.getElementById("hxLiveClock");
  const dateEl = document.getElementById("hxLiveDate");

  const kpiPaidEl = document.getElementById("hxKpiPaid");
  const kpiOrdersEl = document.getElementById("hxKpiOrders");
  const kpiPendingEl = document.getElementById("hxKpiPending");
  const kpiAvgEl = document.getElementById("hxKpiAvg");

  const searchInput = document.getElementById("hxSearchInput");
  const statusFilter = document.getElementById("hxStatusFilter");
  const fulfillmentFilter = document.getElementById("hxFulfillmentFilter");
  const periodFilter = document.getElementById("hxPeriodFilter");
  const sortFilter = document.getElementById("hxSortFilter");
  const exportCsvBtn = document.getElementById("hxExportCsvBtn");

  const emptyBox = document.getElementById("hxEmptyBox");
  const salesListEl = document.getElementById("hxSalesList");

  let activeBranchId = null;
  let lastFilteredRows = [];

  function updateClock() {
    const now = new Date();
    if (clockEl) {
      clockEl.textContent = now.toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      });
    }
    if (dateEl) {
      dateEl.textContent = now.toLocaleDateString("sw-TZ", {
        weekday: "long",
        day: "numeric",
        month: "short",
        year: "numeric"
      });
    }
  }

  setInterval(updateClock, 1000);
  updateClock();

  function formatTZS(num) {
    const val = Number(num) || 0;
    return "TZS " + val.toLocaleString("en-US", { maximumFractionDigits: 0 });
  }

  function getSalesSource() {
    const rawSales =
      (typeof state !== "undefined" && Array.isArray(state.sales) && state.sales) ||
      (window.state && Array.isArray(window.state.sales) && window.state.sales) ||
      [];

    return rawSales.filter((s) => {
      if (!activeBranchId) return true;
      return String(s.branch_id || s.branchId || "") === String(activeBranchId);
    });
  }

  function getFilteredSales() {
    const q = (searchInput?.value || "").trim().toLowerCase();
    const statusVal = statusFilter?.value || "ALL";
    const fulfillmentVal = fulfillmentFilter?.value || "ALL";
    const periodVal = periodFilter?.value || "30";
    const sortVal = sortFilter?.value || "NEWEST";

    const nowMs = Date.now();
    const dayMs = 24 * 60 * 60 * 1000;

    let rows = getSalesSource().filter((sale) => {
      const ts = new Date(sale.created_at || sale.date || sale.timestamp || Date.now()).getTime();
      if (periodVal !== "ALL") {
        const days = Number(periodVal) || 30;
        if (nowMs - ts > days * dayMs) return false;
      }

      const rawStatus = String(sale.payment_status || sale.status || "PAID").toUpperCase();
      if (statusVal !== "ALL") {
        if (statusVal === "PAID" && !["PAID", "COMPLETED", "IMELIPWA"].includes(rawStatus)) return false;
        if (statusVal === "PENDING" && !["PENDING", "CREDIT", "MKOPO", "UNPAID"].includes(rawStatus)) return false;
        if (statusVal === "CANCELLED" && !["CANCELLED", "VOID", "IMEFUTWA"].includes(rawStatus)) return false;
      }

      const rawFulfill = String(sale.fulfillment_status || sale.delivery_status || "DELIVERED").toUpperCase();
      if (fulfillmentVal !== "ALL") {
        if (fulfillmentVal === "DELIVERED" && !["DELIVERED", "COMPLETED", "IMEKABIDHIWA"].includes(rawFulfill)) return false;
        if (fulfillmentVal === "PICKUP" && !["PICKUP", "DUKANI"].includes(rawFulfill)) return false;
        if (fulfillmentVal === "PENDING" && !["PENDING", "BADO"].includes(rawFulfill)) return false;
      }

      if (q) {
        const receipt = String(sale.receipt_no || sale.receipt || sale.id || "").toLowerCase();
        const customer = String(sale.customer_name || sale.customer || "").toLowerCase();
        const itemsText = Array.isArray(sale.items)
          ? sale.items.map((it) => it.name || it.product_name || "").join(" ").toLowerCase()
          : String(sale.items_summary || sale.product_name || "").toLowerCase();
        if (!receipt.includes(q) && !customer.includes(q) && !itemsText.includes(q)) return false;
      }

      return true;
    });

    rows.sort((a, b) => {
      const aTotal = Number(a.total ?? a.amount ?? 0);
      const bTotal = Number(b.total ?? b.amount ?? 0);
      const aTime = new Date(a.created_at || a.date || 0).getTime();
      const bTime = new Date(b.created_at || b.date || 0).getTime();

      if (sortVal === "OLDEST") return aTime - bTime;
      if (sortVal === "HIGH_AMOUNT") return bTotal - aTotal;
      if (sortVal === "LOW_AMOUNT") return aTotal - bTotal;
      return bTime - aTime;
    });

    return rows;
  }

  function renderHistoria() {
    updateClock();
    const rows = getFilteredSales();
    lastFilteredRows = rows;

    let paidSum = 0;
    let pendingSum = 0;
    let totalOrdersSum = 0;

    rows.forEach((sale) => {
      const total = Number(sale.total ?? sale.amount ?? 0);
      const paid = Number(sale.paid_amount ?? sale.amount_paid ?? 0);
      const st = String(sale.payment_status || sale.status || "PAID").toUpperCase();

      if (["CANCELLED", "VOID", "IMEFUTWA"].includes(st)) return;

      totalOrdersSum += total;
      if (paid > 0) {
        paidSum += paid;
      } else if (["PAID", "COMPLETED", "IMELIPWA"].includes(st)) {
        paidSum += total;
      }

      const bal = sale.balance != null ? Number(sale.balance) : Math.max(0, total - (paid > 0 ? paid : (["PAID", "COMPLETED", "IMELIPWA"].includes(st) ? total : 0)));
      pendingSum += bal;
    });

    const count = rows.length;
    const avg = count > 0 ? totalOrdersSum / count : 0;

    if (kpiPaidEl) kpiPaidEl.textContent = formatTZS(paidSum);
    if (kpiOrdersEl) kpiOrdersEl.textContent = String(count);
    if (kpiPendingEl) kpiPendingEl.textContent = formatTZS(pendingSum);
    if (kpiAvgEl) kpiAvgEl.textContent = formatTZS(avg);

    if (!count) {
      if (emptyBox) emptyBox.style.display = "block";
      if (salesListEl) salesListEl.innerHTML = "";
      return;
    }

    if (emptyBox) emptyBox.style.display = "none";
    if (salesListEl) {
      salesListEl.innerHTML = rows
        .map((sale) => {
          const receipt = sale.receipt_no || sale.receipt || sale.id || "RISITI";
          const customer = sale.customer_name || sale.customer || "Mteja wa Jumla/Rejareja";
          const dateStr = sale.created_at
            ? new Date(sale.created_at).toLocaleString("sw-TZ", { dateStyle: "medium", timeStyle: "short" })
            : "";
          const total = Number(sale.total ?? sale.amount ?? 0);
          return `
            <div class="hx-sale-item">
              <div>
                <div class="hx-sale-title">${receipt} • ${customer}</div>
                <div class="hx-sale-meta">${dateStr}</div>
              </div>
              <div class="hx-sale-amount">${formatTZS(total)}</div>
            </div>
          `;
        })
        .join("");
    }
  }

  function exportCsv() {
    const headers = ["Risiti", "Mteja", "Hali ya Malipo", "Utoaji", "Jumla (TZS)", "Tarehe"];
    const lines = [headers.join(",")];

    lastFilteredRows.forEach((s) => {
      const row = [
        s.receipt_no || s.receipt || s.id || "",
        s.customer_name || s.customer || "",
        s.payment_status || s.status || "PAID",
        s.fulfillment_status || "DELIVERED",
        Number(s.total ?? s.amount ?? 0),
        s.created_at || ""
      ].map((v) => `"${String(v).replace(/"/g, '""')}"`);
      lines.push(row.join(","));
    });

    const blob = new Blob([lines.join("\n")], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `historia-ya-mauzo-${new Date().toISOString().slice(0, 10)}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  }

  window.openHqHistoriaMauzo = function (branchId = null) {
    activeBranchId = branchId;
    if (screenEl) {
      screenEl.classList.add("is-open");
      screenEl.setAttribute("aria-hidden", "false");
    }
    renderHistoria();
  };

  window.closeHqHistoriaMauzo = function () {
    if (screenEl) {
      screenEl.classList.remove("is-open");
      screenEl.setAttribute("aria-hidden", "true");
    }
  };

  if (backBtn) backBtn.addEventListener("click", window.closeHqHistoriaMauzo);
  [searchInput, statusFilter, fulfillmentFilter, periodFilter, sortFilter].forEach((el) => {
    if (el) el.addEventListener("input", renderHistoria);
    if (el) el.addEventListener("change", renderHistoria);
  });
  if (exportCsvBtn) exportCsvBtn.addEventListener("click", exportCsv);

  document.querySelectorAll("[data-hx-nav]").forEach((btn) => {
    btn.addEventListener("click", () => {
      window.closeHqHistoriaMauzo();
    });
  });
})();
</script>
